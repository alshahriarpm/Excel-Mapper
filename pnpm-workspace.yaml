# pnpm 11 reads build-script and other settings from here (no longer package.json).
# Prisma needs its postinstall to download the query engine binary.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: false
  prisma: true
  sharp: false
  unrs-resolver: false
onlyBuiltDependencies:
  - prisma
  - '@prisma/client'
  - '@prisma/engines'
